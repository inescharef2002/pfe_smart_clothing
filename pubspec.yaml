name: pfe_smart_clothing
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  get_it: ^8.0.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # Network & HTTP
  http: ^1.2.1
  flutter_dotenv: ^5.2.1

  # UI & Design
  google_fonts: ^6.2.1
  introduction_screen: ^3.1.14
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1

  # Camera & Images
  image_picker: ^1.1.2
  camera: ^0.11.0
  google_sign_in: ^7.2.0

  # Location
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo.png
    - assets/images/j1.webp
    - assets/images/j2.webp
    - assets/images/j3.webp
    - assets/images/google_logo.png
